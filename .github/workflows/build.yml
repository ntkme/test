name: build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        ruby-version:
          - ruby

    steps:

      - name: Setup ruby
        if: matrix.ruby-version
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Test
        run: |
          gem install --platform ruby openssl

      - name: Version
        run: |
          ruby -ropenssl -e 'puts OpenSSL::OPENSSL_VERSION'
          ruby -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'

      - name: Debug
        if: failure()
        run: echo
