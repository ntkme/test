name: build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        ruby-version:
          - mswin

    steps:

      - name: Setup ruby
        if: matrix.ruby-version
        uses: ruby/setup-ruby@v1.339.0
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Test
        run: |
          echo "${env:VCPKG_INSTALLATION_ROOT}"
          dir "${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows"
          dir "${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\tools\pkgconf\pkgconf.exe"
          cat "D:/ruby-head-x64-mswin64_140/lib/ruby/4.1.0+6/x64-mswin64_140/rbconfig.rb"

      - name: Test
        run: |
          gem install fiddle
        env:
          CONFIGURE_ARGS: --with-opt-dir=C:\vcpkg\installed\x64-windows
          PKG_CONFIG: C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe

      - name: Debug
        if: failure()
        run: |
          $env:CONFIGURE_ARGS = "--with-opt-dir=${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows"
          echo "${env:CONFIGURE_ARGS}"
          $env:PKG_CONFIG = "${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\tools\pkgconf\pkgconf.exe"
          echo "${env:PKG_CONFIG}"
          ruby -d D:/ruby-head-x64-mswin64_140/lib/ruby/gems/4.1.0+6/gems/fiddle-1.1.8/ext/fiddle/extconf.rb
