name: build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        ruby-version:
          - mswin

    steps:

      - name: Setup ruby
        if: matrix.ruby-version
        uses: ruby/setup-ruby@v1.339.0
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Test
        run: |
          $Env:PKG_CONFIG = "$VCPKG_INSTALLATION_ROOT/tools/pkgconf/pkgconf.exe"

          gem install fiddle
