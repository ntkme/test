name: build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        ruby-version:
          - mswin

    steps:

      - name: Setup ruby
        if: matrix.ruby-version
        uses: ruby/setup-ruby@v1.339.0
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Setup vcpkg
        run: |
          echo @"
          INCLUDE=${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\include;${env:INCLUDE}
          LIB=${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\lib;${env:LIB}
          PKG_CONFIG=${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\tools\pkgconf\pkgconf.exe
          "@ | Tee-Object -FilePath "${env:GITHUB_ENV}" -Append -Encoding UTF8

      - name: Test
        run: |
          gem install --verbose fiddle
