name: build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: mswin
          bundler-cache: true

      - name: Test
        run: bundle exec ruby -r sass-embedded -e "puts Sass.info"
