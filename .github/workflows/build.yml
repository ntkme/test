name: build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        ruby-version:
          - ruby-head

    steps:

      - name: Setup ruby
        if: matrix.ruby-version
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Test
        run: |
          gem install --platform ruby google-protobuf -- --with-cflag=-Wno-error=incompatible-pointer-types

      - name: Debug
        if: failure()
        run: |
          cat D:/rubyinstaller-head-x64/lib/ruby/gems/4.1.0+6/gems/google-protobuf-4.36.2/Makefile

